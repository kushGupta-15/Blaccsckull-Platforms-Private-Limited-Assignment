services:
  mongo:
    image: mongo:7.0
    container_name: feedants-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - feedants-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedants-backend
    restart: unless-stopped
    ports:
      - '${PORT:-5000}:5000'
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/feedants}
      JWT_SECRET: ${JWT_SECRET:-feedants_production_jwt_secret_change_me_12345678}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - feedants-network

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    container_name: feedants-frontend-web
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      - backend
    networks:
      - feedants-network

volumes:
  mongo-data:
    driver: local

networks:
  feedants-network:
    driver: bridge
